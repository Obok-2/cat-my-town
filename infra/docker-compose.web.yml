# 웹 서버 전용 Nginx. 로컬 DB·MinIO용 docker-compose.yml과 독립 구성.
# 서버 기준 경로: /home/opc/web
# 실행 전 dist/에 빌드 파일, nginx/default.conf에 Nginx 설정을 준비한다.
name: cat-my-town-web

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # 빌드 결과는 호스트에서 관리하고 Nginx에서는 읽기만 한다.
      - type: bind
        source: /home/opc/web/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/opc/web/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      # 컨테이너를 재생성해도 호스트에 로그를 보관한다.
      - type: bind
        source: /home/opc/web/logs/nginx
        target: /var/log/nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
