# 로컬 개발용 인프라 - PostgreSQL + pgvector
#   cd infra && docker compose up -d
# 로컬 전용이라 DB명/계정/비밀번호는 하드코딩한다 (server application.properties 기본값과 동일 — 비밀번호를 바꾸면 두 곳을 함께 수정).
name: cat-my-town

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cat-my-town-db
    environment:
      POSTGRES_DB: catmytown
      POSTGRES_USER: catmytown
      POSTGRES_PASSWORD: ***REMOVED***
    ports:
      # 호스트 5432는 이미 다른 PostgreSQL이 쓰고 있을 수 있어 충돌을 피하려고 5455로 연다
      - "5455:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
