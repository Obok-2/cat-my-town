spring.application.name=cat-my-town-server
server.port=${SERVER_PORT:8080}

# DB 접속 정보 - 실제 값은 Git에 커밋하지 않고 실행 환경에서 주입한다.
spring.datasource.url=jdbc:postgresql://localhost:5455/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jackson.time-zone=Asia/Seoul

# 촬영 이미지 분석
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
camera.cat-detection.min-confidence=${CAT_DETECTION_MIN_CONFIDENCE:0.15}
camera.match.threshold=${CAT_MATCH_THRESHOLD:40.0}
camera.match.lower-bound=${CAT_MATCH_LOWER_BOUND:0.75}
camera.match.upper-bound=${CAT_MATCH_UPPER_BOUND:0.92}
camera.match.max-candidates=3
camera.voyage.api-key=${VOYAGE_API_KEY:}
camera.voyage.model=${VOYAGE_MODEL:voyage-multimodal-3.5}
camera.voyage.url=https://api.voyageai.com/v1/multimodalembeddings

# MyBatis
mybatis.config-location=classpath:mybatis/mybatis-config.xml
mybatis.type-aliases-package=com.catmytown.server.model
mybatis.mapper-locations=mybatis/mappers/*.xml

# Actuator - health 만 공개
management.endpoints.web.exposure.include=health
