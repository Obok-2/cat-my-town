spring.application.name=cat-my-town-server
server.port=${SERVER_PORT:8080}

# DB 접속 정보 - 로컬 전용이라 하드코딩. infra/docker-compose.yml 과 값이 같아야 한다 (포트 5455, 비밀번호 포함).
spring.datasource.url=jdbc:postgresql://localhost:5455/catmytown
spring.datasource.username=catmytown
spring.datasource.password=***REMOVED***

spring.jackson.time-zone=Asia/Seoul

# MyBatis
mybatis.config-location=classpath:mybatis/mybatis-config.xml
mybatis.type-aliases-package=com.catmytown.server.model
mybatis.mapper-locations=mybatis/mappers/*.xml

# Actuator - health 만 공개
management.endpoints.web.exposure.include=health
