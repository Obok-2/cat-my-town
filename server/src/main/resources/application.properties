spring.application.name=cat-my-town-server
server.port=${SERVER_PORT:8080}

# DB 접속 정보 - docker-compose.yml 의 DB 기본값과 동일. 환경변수로 덮어쓴다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catmytown}
spring.datasource.username=${DB_USERNAME:catmytown}
spring.datasource.password=${DB_PASSWORD:***REMOVED***}

spring.jackson.time-zone=Asia/Seoul

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Actuator - health 만 공개
management.endpoints.web.exposure.include=health
